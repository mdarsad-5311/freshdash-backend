services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: freshdash-api:latest
    container_name: freshdash_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DEBUG=False
      - SECRET_KEY=${SECRET_KEY}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
      - ALLOWED_HOSTS=${ALLOWED_HOSTS:-*}
      - CORS_ALLOW_ALL_ORIGINS=${CORS_ALLOW_ALL_ORIGINS:-False}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-}
      - CSRF_TRUSTED_ORIGINS=${CSRF_TRUSTED_ORIGINS:-}
      - SQLITE_DB_PATH=/data/db.sqlite3
      - MEDIA_ROOT=/data/media
      - LOG_LEVEL=INFO
    volumes:
      # Persistent storage volume for SQLite3 database and media files
      - freshdash_data:/data
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/api/v1/health/\")'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  freshdash_data:
    name: freshdash_persistent_storage

