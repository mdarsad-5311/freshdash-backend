          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
  /api/v1/cart/{id}/:
    patch:
      operationId: v1_cart_partial_update
      description: |-
        Change item quantity by delta (+1 / -1) or set explicit quantity.
        Accepts numeric PK or composite key (e.g. 'tomato:regular').
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
        description: Cart item ID or product key (e.g. tomato:regular)
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantityUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantityUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedCartItemQuantityUpdateRequest'
