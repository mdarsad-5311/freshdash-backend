components:
  schemas:
    Address:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          $ref: '#/components/schemas/NameEnum'
        line:
          type: string
          description: Street address line
          maxLength: 255
        area:
          type: string
          description: Locality, City, Postal code
          maxLength: 255
        is_default:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - area
      - created_at
      - id
      - line
      - updated_at
    AddressRequest:
      type: object
      properties:
        name:
          $ref: '#/components/schemas/NameEnum'
        line:
          type: string
          minLength: 1
          description: Street address line
          maxLength: 255
        area:
          type: string
          minLength: 1
          description: Locality, City, Postal code
          maxLength: 255
        is_default:
          type: boolean
      required:
      - area
      - line
    CartItem:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        key:
          type: string
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        large:
          type: boolean
          description: Double pack variant
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        unit_original:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        total_savings:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - key
      - product
      - total_price
      - total_savings
      - unit_original
      - unit_price
      - updated_at
    CartItemRequest:
      type: object
      properties:
        product_id:
          type: string
          minLength: 1
          description: Unique slug id like 'tomato', 'banana'
          writeOnly: true
        quantity:
          type: integer
          maximum: 9223372036854775807
          minimum: 1
          format: int64
        large:
          type: boolean
          description: Double pack variant
      required:
      - product_id
    Category:
      type: object
      properties:
        id:
          type: string
          description: Slug identifier like 'vegetables'
          maxLength: 50
        name:
          type: string
          maxLength: 100
        photo:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
          description: Atlas photo index for frontend produce photo
        tint:
          type: string
          description: Hex code tint for mobile card background
          maxLength: 20
        is_active:
          type: boolean
        products_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - products_count
      - updated_at
    Coupon:
      type: object
      properties:
        code:
          type: string
          maxLength: 30
        description:
          type: string
          maxLength: 255
        discount_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Discount percentage in decimal form (0.20 for 20%)
        discount_percentage:
          type: integer
          readOnly: true
        max_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - code
      - description
      - discount_percentage
    CouponRequest:
      type: object
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 30
        description:
          type: string
          minLength: 1
          maxLength: 255
        discount_rate:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
          description: Discount percentage in decimal form (0.20 for 20%)
        max_discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        min_order_value:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
        is_active:
          type: boolean
      required:
      - code
      - description
    FAQ:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        question:
          type: string
          maxLength: 255
        answer:
          type: string
        order:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
      required:
      - answer
      - id
      - question
    FavoriteProduct:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - product
    FavoriteProductRequest:
      type: object
      properties:
        product_id:
          type: string
          minLength: 1
          description: Unique slug id like 'tomato', 'banana'
          writeOnly: true
      required:
      - product_id
    LoginRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
          description: Username or email address
        password:
          type: string
          writeOnly: true
          minLength: 1
      required:
      - password
      - username
    LogoutRequest:
      type: object
      properties:
        refresh:
          type: string
          minLength: 1
          description: The refresh token to be blacklisted
      required:
      - refresh
    NameEnum:
      enum:
      - Home
      - Work
      - Other
      type: string
      description: |-
        * `Home` - Home
        * `Work` - Work
        * `Other` - Other
    Order:
      type: object
