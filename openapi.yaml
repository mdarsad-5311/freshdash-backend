      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Address'
          description: ''
    delete:
      operationId: v1_addresses_destroy
      description: User delivery addresses with ownership security and default address
        management.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Address.
        required: true
      tags:
      - v1
      security:
      - jwtAuth: []
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
