openapi: 3.0.3
info:
  title: FreshDash REST API
  version: 1.0.0
  description: Production-ready REST API for FreshDash quick-commerce mobile app.
paths:
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Authenticate a user with username or email with rate limiting.
        Returns JWT access & refresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      - cookieAuth: []
      - {}
      responses:
        '200':
          description: JWT tokens and user details
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Logout user by blacklisting their refresh token.
        Prevents token reuse and revokes active session.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      security:
      - jwtAuth: []
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          description: Logged out and refresh token blacklisted
  /api/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Retrieve and update profile settings (order_updates, notifications,
        phone).
      tags:
      - auth
      security:
      - jwtAuth: []
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Retrieve and update profile settings (order_updates, notifications,
        phone).
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdateRequest'
      security:
      - jwtAuth: []
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
          description: ''
  /api/auth/signup/:
    post:
      operationId: auth_signup_create
      description: |-
        Register a new customer account with password strength validation
        and unique email enforcement. Returns JWT access & refresh tokens.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/SignupRequest'
          multipart/form-data:
            schema:
