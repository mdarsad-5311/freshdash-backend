      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartItem'
          description: ''
    delete:
      operationId: v1_cart_destroy
      description: |-
        Remove item completely from basket.
        Accepts numeric PK or composite key.
      parameters:
      - in: path
        name: id
        schema:
          type: string
        required: true
      - in: path
        name: pk
        schema:
          type: string
        description: Cart item ID or product key (e.g. tomato:regular)
        required: true
      tags:
